name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# Grants GITHUB_TOKEN the permissions the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Lets a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the `packageManager` field in package.json and installs that
      # exact pnpm version, so CI matches local development.
      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs `astro check` then `astro build`, so a type error fails the deploy.
      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
